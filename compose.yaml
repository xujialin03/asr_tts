services:
  kws:
    build:
      context: ./kws-service
    container_name: qwen3-kws
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      KWS_MODEL_ROOT: /models
      KWS_KEYWORDS_FILE: /app/keywords.txt
      KWS_KEYWORDS_SCORE: ${KWS_KEYWORDS_SCORE:-1.5}
      KWS_KEYWORDS_THRESHOLD: ${KWS_KEYWORDS_THRESHOLD:-0.20}
      KWS_NUM_TRAILING_BLANKS: ${KWS_NUM_TRAILING_BLANKS:-1}
    volumes:
      - kws_models:/models

  voiceprint:
    build:
      context: ./voiceprint-service
    container_name: qwen3-voiceprint
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8001"
    environment:
      VOICEPRINT_DATABASE_URL: ${VOICEPRINT_DATABASE_URL:-postgresql://qwen3_asr:change-me@host.docker.internal:5432/qwen3_asr}
      VOICEPRINT_MODEL_ID: iic/speech_campplus_sv_zh-cn_16k-common
      VOICEPRINT_MODEL_REVISION: v1.0.0
      VOICEPRINT_MODEL_DIR: /models
      VOICEPRINT_DEVICE: cpu
      VOICEPRINT_IDENTIFY_THRESHOLD: ${VOICEPRINT_IDENTIFY_THRESHOLD:-0.55}
      VOICEPRINT_UNCERTAIN_THRESHOLD: ${VOICEPRINT_UNCERTAIN_THRESHOLD:-0.45}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - voiceprint_models:/models

volumes:
  kws_models:
  voiceprint_models:
