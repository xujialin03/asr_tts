name: zhiling

services:
  postgres:
    image: postgres:15-alpine
    container_name: zhiling-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qwen3_asr}
      POSTGRES_USER: ${POSTGRES_USER:-qwen3_asr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - zhiling_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qwen3_asr} -d ${POSTGRES_DB:-qwen3_asr}"]
      interval: 5s
      timeout: 3s
      retries: 10

  voiceprint:
    build:
      context: ./voiceprint-service
    container_name: zhiling-voiceprint
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8001"
    environment:
      VOICEPRINT_DATABASE_URL: postgresql://${POSTGRES_USER:-qwen3_asr}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-qwen3_asr}
      VOICEPRINT_MODEL_ID: iic/speech_campplus_sv_zh-cn_16k-common
      VOICEPRINT_MODEL_REVISION: v1.0.0
      VOICEPRINT_MODEL_DIR: /models
      VOICEPRINT_DEVICE: cpu
      VOICEPRINT_IDENTIFY_THRESHOLD: ${VOICEPRINT_IDENTIFY_THRESHOLD:-0.55}
      VOICEPRINT_UNCERTAIN_THRESHOLD: ${VOICEPRINT_UNCERTAIN_THRESHOLD:-0.45}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - voiceprint_models:/models

  kws:
    build:
      context: ./kws-service
    container_name: zhiling-kws
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      KWS_MODEL_ROOT: /models
      KWS_KEYWORDS_FILE: /app/keywords.txt
      KWS_KEYWORDS_SCORE: ${KWS_KEYWORDS_SCORE:-1.5}
      KWS_KEYWORDS_THRESHOLD: ${KWS_KEYWORDS_THRESHOLD:-0.20}
      KWS_NUM_TRAILING_BLANKS: ${KWS_NUM_TRAILING_BLANKS:-1}
    volumes:
      - kws_models:/models

volumes:
  zhiling_pgdata:
  voiceprint_models:
  kws_models:
