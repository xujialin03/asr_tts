[project]
name = "qwen3-kws-service"
version = "0.1.0"
description = "Replaceable sherpa-onnx keyword spotting HTTP service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "pydantic-settings>=2.6",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
